services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpilot}
      POSTGRES_DB: ${POSTGRES_DB:-devpilot}
    ports:
      - "127.0.0.1:${DEVPILOT_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devpilot} -d ${POSTGRES_DB:-devpilot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./service
    restart: unless-stopped
    env_file: ${DEVPILOT_ENV_FILE:-.env}
    environment:
      KNOWLEDGE_DATA_DIR: /app/data
    volumes:
      - knowledge_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEVPILOT_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 12

  web:
    build: ./vue
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DEVPILOT_WEB_BIND:-127.0.0.1}:${DEVPILOT_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 6s
      retries: 12

  jenkins:
    build:
      context: ./jenkins
    image: devpilot-jenkins:lts-jdk21-docker
    profiles:
      - ci
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  jenkins_home:
  knowledge_data:
