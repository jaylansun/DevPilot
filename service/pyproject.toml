[project]
name = "devpilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "chromadb>=1,<2",
    "fastapi>=0.116,<1",
    "fastembed>=0.7,<1",
    "langchain>=1,<2",
    "langchain-text-splitters>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "python-multipart>=0.0.20,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pyjwt>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
    "langgraph-checkpoint-postgres>=3,<4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
constraint-dependencies = [
    # ONNX Runtime 1.23.x provides Intel macOS wheels for Python 3.12 and 3.13.
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
]
